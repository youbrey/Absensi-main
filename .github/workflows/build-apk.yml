name: Verify and Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Test backend contract
        run: node --test backend/Code.test.cjs
      - name: Test, lint and build
        # ABSENSI_WEBHOOK_URL / ABSENSI_SYNC_TOKEN are optional repo secrets. If set, the
        # resulting APK already has Sheets sync configured — no per-device manual entry.
        # Configure them under Settings > Secrets and variables > Actions if you want this.
        env:
          ABSENSI_WEBHOOK_URL: ${{ secrets.ABSENSI_WEBHOOK_URL }}
          ABSENSI_SYNC_TOKEN: ${{ secrets.ABSENSI_SYNC_TOKEN }}
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
